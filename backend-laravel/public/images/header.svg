<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="auto">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@700&amp;family=Noto+Sans+Tifinagh&amp;display=swap');
      .title-ar {
        font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade New', serif;
        font-weight: 700;
        fill: #192a56;
      }
      .tifinagh {
        font-family: 'Noto Sans Tifinagh', 'DejaVu Sans', sans-serif;
        fill: #192a56;
        letter-spacing: 2px;
      }
      .header-ar {
        font-family: 'Amiri', 'Traditional Arabic', serif;
        font-weight: 700;
        fill: #192a56;
        font-size: 26px;
      }
      .header-tif {
        font-family: 'Noto Sans Tifinagh', sans-serif;
        fill: #192a56;
        font-size: 22px;
        letter-spacing: 1.5px;
      }
    </style>
    <!-- Gradients for Moroccan Royal Crest -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9D423" />
      <stop offset="50%" stop-color="#E1A100" />
      <stop offset="100%" stop-color="#B77700" />
    </linearGradient>
    <linearGradient id="redShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C0392B" />
      <stop offset="100%" stop-color="#962214" />
    </linearGradient>
    <linearGradient id="greenStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ECC71" />
      <stop offset="100%" stop-color="#1B7A43" />
    </linearGradient>
  </defs>

  <!-- Left: Tifinagh Kingdom & Ministry -->
  <g transform="translate(190, 60)" text-anchor="middle">
    <text x="0" y="0" class="header-tif">ⵜⴰⴳⵍⴷⵉⵜ ⵏ ⵍⵎⵖⵔⵉⴱ</text>
    <text x="0" y="38" class="header-tif">ⵜⴰⵎⴰⵡⴰⵙⵜ ⵏ ⵓⵙⴳⵎⵉ ⴰⵏⴰⵎⵓⵔ</text>
    <text x="0" y="76" class="header-tif">ⴷ ⵓⵙⵙⵍⵎⴷ ⴰⵎⵣⵡⴰⵔⵓ ⴷ ⵜⵓⵏⵏⵓⵏⵜ</text>
  </g>

  <!-- Center: Moroccan Royal Coat of Arms (الشعار الرسمي للمملكة المغربية) -->
  <g id="royal-crest" transform="translate(500, 95) scale(0.65)">
    <!-- Crown (التاج الملكي) -->
    <g transform="translate(0, -115)">
      <path d="M -45,15 C -45,15 -35,-25 0,-30 C 35,-25 45,15 45,15 Z" fill="url(#goldGrad)" stroke="#8A5A00" stroke-width="2"/>
      <ellipse cx="0" cy="15" rx="45" ry="8" fill="#B77700" stroke="#5C3C00" stroke-width="1.5" />
      <!-- Crown jewels -->
      <circle cx="-30" cy="15" r="3.5" fill="#E74C3C" />
      <circle cx="-15" cy="15" r="3.5" fill="#2ECC71" />
      <circle cx="0" cy="15" r="4.5" fill="#F1C40F" />
      <circle cx="15" cy="15" r="3.5" fill="#2ECC71" />
      <circle cx="30" cy="15" r="3.5" fill="#E74C3C" />
      <!-- Star on crown -->
      <polygon points="0,-42 3,-33 11,-33 5,-28 7,-20 0,-24 -7,-20 -5,-28 -11,-33 -3,-33" fill="#2ECC71" stroke="#166534" stroke-width="1"/>
      <circle cx="0" cy="-44" r="3" fill="#F1C40F" />
    </g>

    <!-- Shield (الدرع) -->
    <g transform="translate(0, 0)">
      <!-- Shield border -->
      <path d="M -50,-60 L 50,-60 L 50,5 C 50,55 25,80 0,95 C -25,80 -50,55 -50,5 Z" fill="#F9D423" stroke="#8A5A00" stroke-width="4"/>
      <!-- Inner Shield -->
      <path d="M -42,-52 L 42,-52 L 42,5 C 42,48 20,72 0,85 C -20,72 -42,48 -42,5 Z" fill="url(#redShield)"/>
      <!-- Rising Sun (الشمس المشرقة) -->
      <g transform="translate(0, -10)">
        <!-- Rays -->
        <path d="M 0,-42 L 0,-15 M -12,-39 L -5,-15 M 12,-39 L 5,-15 M -24,-33 L -10,-15 M 24,-33 L 10,-15 M -33,-24 L -15,-15 M 33,-24 L 15,-15" stroke="#F1C40F" stroke-width="3" stroke-linecap="round"/>
        <!-- Sun disc -->
        <circle cx="0" cy="-10" r="16" fill="#F39C12" stroke="#E67E22" stroke-width="1.5"/>
        <!-- Atlas mountains base -->
        <path d="M -40,10 L -25,-5 L -10,8 L 10,-10 L 25,5 L 40,8 L 40,25 C 30,30 15,35 0,35 C -15,35 -30,30 -40,25 Z" fill="#27AE60" stroke="#1E8449" stroke-width="1.5"/>
      </g>
      <!-- Green Pentagram (النجمة الخماسية الخضراء) -->
      <g transform="translate(0, 42)">
        <polygon points="0,-22 6.5,-5 24,-5 10,5 15,22 0,11 -15,22 -10,5 -24,-5 -6.5,-5" fill="none" stroke="#2ECC71" stroke-width="3.5" stroke-linejoin="round"/>
        <polygon points="0,-18 5,-4 19,-4 8,4 12,18 0,9 -12,18 -8,4 -19,-4 -5,-4" fill="url(#greenStar)"/>
      </g>
    </g>

    <!-- Supporter Lions (الليثان الأطلسيان) -->
    <!-- Left Lion (الأسد الأيسر) -->
    <g transform="translate(-85, 5)">
      <!-- Lion body & head silhouette -->
      <path d="M 15,-60 C 5,-70 -15,-65 -25,-50 C -35,-35 -30,-15 -25,0 C -30,15 -35,35 -25,55 C -15,65 5,70 15,65 C 20,45 15,15 15,-10 C 15,-30 20,-50 15,-60 Z" fill="url(#goldGrad)" stroke="#8A5A00" stroke-width="2"/>
      <!-- Lion mane & roaring head -->
      <circle cx="-15" cy="-55" r="14" fill="#E1A100" stroke="#8A5A00" stroke-width="1.5"/>
      <path d="M -22,-62 C -20,-72 -10,-72 -5,-65 C 0,-60 -5,-50 -10,-50 Z" fill="#B77700"/>
      <!-- Lion paws resting on shield -->
      <ellipse cx="20" cy="-35" rx="8" ry="5" fill="#F9D423" stroke="#8A5A00" stroke-width="1.5"/>
      <ellipse cx="20" cy="20" rx="8" ry="5" fill="#F9D423" stroke="#8A5A00" stroke-width="1.5"/>
      <!-- Lion tail -->
      <path d="M -25,50 C -45,45 -55,20 -50,5 C -45,-10 -55,-15 -60,-5" fill="none" stroke="#E1A100" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-60" cy="-5" r="5" fill="#B77700"/>
    </g>

    <!-- Right Lion (الأسد الأيمن) -->
    <g transform="translate(85, 5) scale(-1, 1)">
      <!-- Lion body & head silhouette -->
      <path d="M 15,-60 C 5,-70 -15,-65 -25,-50 C -35,-35 -30,-15 -25,0 C -30,15 -35,35 -25,55 C -15,65 5,70 15,65 C 20,45 15,15 15,-10 C 15,-30 20,-50 15,-60 Z" fill="url(#goldGrad)" stroke="#8A5A00" stroke-width="2"/>
      <!-- Lion mane & roaring head -->
      <circle cx="-15" cy="-55" r="14" fill="#E1A100" stroke="#8A5A00" stroke-width="1.5"/>
      <path d="M -22,-62 C -20,-72 -10,-72 -5,-65 C 0,-60 -5,-50 -10,-50 Z" fill="#B77700"/>
      <!-- Lion paws resting on shield -->
      <ellipse cx="20" cy="-35" rx="8" ry="5" fill="#F9D423" stroke="#8A5A00" stroke-width="1.5"/>
      <ellipse cx="20" cy="20" rx="8" ry="5" fill="#F9D423" stroke="#8A5A00" stroke-width="1.5"/>
      <!-- Lion tail -->
      <path d="M -25,50 C -45,45 -55,20 -50,5 C -45,-10 -55,-15 -60,-5" fill="none" stroke="#E1A100" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-60" cy="-5" r="5" fill="#B77700"/>
    </g>

    <!-- Scroll Banner: إن تنصروا الله ينصركم (شريط الآية الكريمة) -->
    <g transform="translate(0, 95)">
      <path d="M -85,15 C -55,2 -25,18 0,15 C 25,18 55,2 85,15 C 75,32 50,26 0,28 C -50,26 -75,32 -85,15 Z" fill="#FFF2A3" stroke="#B77700" stroke-width="1.5"/>
      <!-- Folded ribbon ends -->
      <path d="M -85,15 L -95,25 L -85,32 L -75,25 Z" fill="#E1A100" stroke="#8A5A00" stroke-width="1"/>
      <path d="M 85,15 L 95,25 L 85,32 L 75,25 Z" fill="#E1A100" stroke="#8A5A00" stroke-width="1"/>
      <!-- Quranic verse text -->
      <text x="0" y="24" text-anchor="middle" font-family="'Amiri', serif" font-weight="bold" font-size="11" fill="#422500" letter-spacing="0.5">
        إِنْ تَنْصُرُوا اللَّهَ يَنْصُرْكُمْ
      </text>
    </g>
  </g>

  <!-- Right: Arabic Kingdom & Ministry Calligraphy -->
  <g transform="translate(810, 60)" text-anchor="middle">
    <text x="0" y="0" class="header-ar">المملكة المغربية</text>
    <text x="0" y="38" class="header-ar">وزارة التربية الوطنية</text>
    <text x="0" y="76" class="header-ar">والتعليم الأولي والرياضة</text>
  </g>

  <!-- Full Width Title: الأكاديمية الجهوية للتربية والتكوين لجهة الشرق -->
  <text x="500" y="238" text-anchor="middle" class="title-ar" font-size="42" letter-spacing="1">
    الأكاديمية الجهوية للتربية والتكوين لجهة الشرق
  </text>

  <!-- Bottom Title in Tifinagh: ⵜⴰⴽⴰⴷⵉⵎⵉⵜ ⵜⴰⵏⵎⵏⴰⴹⵜ ⵏ ⵓⵙⴳⵎⵉ ⴷ ⵓⵙⵎⵓⵜⵜⴳ ⵏ ⵜⵎⵏⴰⴹⵜ ⵏ ⵓⴳⵎⵓⴹ -->
  <text x="500" y="285" text-anchor="middle" class="tifinagh" font-size="25">
    ⵜⴰⴽⴰⴷⵉⵎⵉⵜ ⵜⴰⵏⵎⵏⴰⴹⵜ ⵏ ⵓⵙⴳⵎⵉ ⴷ ⵓⵙⵎⵓⵜⵜⴳ ⵏ ⵜⵎⵏⴰⴹⵜ ⵏ ⵓⴳⵎⵓⴹ
  </text>
</svg>
