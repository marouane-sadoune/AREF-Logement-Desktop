; إعداد تشغيل PHP المضمَّن داخل التطبيق المكتبي.
; الامتدادات تُحمَّل من مجلد ext النسبي: PHP يفسّره نسبةً إلى مجلد php.exe
; وليس إلى مجلد العمل، لذلك يبقى صالحًا مهما كان مسار التثبيت.
; لا تُضبط هنا حدود الذاكرة أو الرفع: القيم الافتراضية المترجَمة تُستعمل كما كان
; في البناء السابق، و NativePHP يمرّر memory_limit و cafile عبر ‎-d‎ عند التشغيل.
extension_dir = "ext"

extension = php_bz2.dll
extension = php_curl.dll
extension = php_fileinfo.dll
extension = php_gd.dll
extension = php_intl.dll
extension = php_mbstring.dll
extension = php_openssl.dll
extension = php_pdo_sqlite.dll
extension = php_sodium.dll
extension = php_sockets.dll
extension = php_sqlite3.dll
extension = php_zip.dll

; لا نحمّل opcache: على ويندوز يفشل عند تعارض ASLR مع مقطع الذاكرة المشترك
; لعمليات PHP أخرى فيُرمى "Fatal Error: Opcode handlers are unusable" وتموت
; العملية قبل أي إخراج — أي أن النافذة قد تفتح فارغة دون سبب ظاهر.
